.timegrid{display:grid;grid-template-columns:140px repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);font-family:var(--mono);font-size:11px}

@media (max-width:760px){nav.tabs button{padding:0 11px;font-size:11px}main{padding:14px 14px 50px}.row,.row3,.row4{grid-template-columns:1fr}.grid,.grid2{grid-template-columns:1fr}.timegrid{grid-template-columns:100px repeat(7,1fr);font-size:10px}}
</style>

<script>
'use strict';
// ════════════════════════════════════════════════════════════════
// FallBooksPractice v1.0.0 · sovereign UK accountancy practice mgmt · MIT
// ◊·κ=1 · prime 809 · multi-client deadlines · agent · time · billing · PII · AML
// TOOL · NOT HMRC-APPROVED FILER · submissions remain practitioner responsibility
// ════════════════════════════════════════════════════════════════
const TOOLNAME='fallbookspractice';
const VERSION='1.0.0';
const PRIME=809;
const STORE='fallbookspractice-v1';
const TAX_YEAR='2025-26';

const RULES={
  vatStandard:0.20,
  vatRegThreshold:90000,
  // PII (UK accountancy bodies)
  icaewPiMinFloor:100000,                // £100k floor
  icaewPiCap:1500000,                    // £1.5M cap
  icaewPiMultiplier:25,                  // 25× highest fee
  accaPiMinFloor:25000,                  // £25k or 25× gross fee income
  accaPiMultiplier:25,
  // CPD
  icaewCpdHours:90,                      // 90 hrs/yr practising
  accaCpdHours:40,                       // 40 units/yr (21 verifiable)
  cimaCpdHours:20,
  // 64-8 (HMRC agent authorisation)
  agentAuth64_8Years:5,                  // not strictly time-limited but recommend 5y review
  // deadlines
  deadlineAmberDays:30,
  deadlineRedDays:7,
  // billing
  invoiceTermsDays:14,
  // retention
  practiceRecordYears:7,
  hmrcRecordYears:6,
  // time recording
  timeUnitMinutes:6,                     // 6-min units
};

const TABS=[
  {id:'dashboard',label:'◊ dashboard'},
  {id:'deadlines',label:'deadlines'},
  {id:'clients',label:'clients'},
  {id:'time',label:'time'},
  {id:'billing',label:'billing'},
  {id:'agent',label:'HMRC agent'},
  {id:'pii',label:'PII'},
  {id:'aml',label:'AML'},
  {id:'cpd',label:'CPD'},
  {id:'advisers',label:'advisers'},
  {id:'firm-pl',label:'firm P&L'},
  {id:'qa',label:'Q&A'},
];

// Deadline kind catalogue — drives auto-population from servicesEngaged + yearEnd + vatScheme
const DEADLINE_KINDS={
  'SA100':{label:'SA100 self-assessment',service:'sa',recurring:'yearly'},
  'CT600':{label:'CT600 corporation tax return',service:'ct',recurring:'yearly'},
  'CT-PAY':{label:'CT payment (9m+1d after PE)',service:'ct',recurring:'yearly'},
  'VAT100':{label:'VAT return',service:'vat',recurring:'quarterly'},
  'P11D':{label:'P11D benefits in kind',service:'payroll',recurring:'yearly'},
  'P60':{label:'P60 to employees',service:'payroll',recurring:'yearly'},
  'ACC':{label:'Companies House accounts',service:'accounts',recurring:'yearly'},
  'CS01':{label:'Confirmation statement',service:'companies-house-filings',recurring:'yearly'},
  'PAYE-FPS':{label:'PAYE FPS (next payday)',service:'payroll',recurring:'monthly'},
  'PAYE-EPS':{label:'PAYE EPS monthly',service:'payroll',recurring:'monthly'},
};

const FEE_TYPES=['initial','ongoing','fixed-monthly','per-job','advisory'];
const ACTIVITY_TYPES=['compliance','advisory','queries','admin','meeting'];
const PROF_BODIES=['ICAEW','ACCA','CIMA','AAT','CIOT','ATT','IFA','other'];

// T0 canned Q&A (offline)
const T0=[
  {q:/icaew.*pi|icaew.*pii|icaew.*insur/i,a:`ICAEW Professional Indemnity minimum cover (2025-26):\n\n• Minimum: 25 × highest annual fee from any one client OR £1.5M (whichever is LOWER)\n• Floor: not less than £100k cover regardless\n• Single-claim and aggregate cover both required\n• Excess limited to greater of £30k or 2% of cover\n• Run-off cover required if firm ceases (2 yrs minimum)\n\nSource: ICAEW Professional Indemnity Insurance Regulations`},
  {q:/acca.*pi|acca.*pii|acca.*insur/i,a:`ACCA Professional Indemnity minimum cover (2025-26):\n\n• Minimum: 25 × gross fee income OR £25,000 (whichever HIGHER)\n• Aggregate cover not less than minimum\n• Run-off cover for 6 years post-cessation recommended\n• Practising cert holders must hold qualifying PI\n\nSource: ACCA Global Practising Regulations`},
  {q:/icaew.*cpd|icaew.*continuing/i,a:`ICAEW CPD requirement (from 2023):\n\n• Practising members: 90 hours/year (CPD must be relevant to work)\n• Non-practising: still 21 hours/year baseline\n• Risk-based category (A/B/C) — most practising = Category 1 highest\n• Annual declaration by 31 October\n• Verifiable evidence required for sample audit\n\nSource: ICAEW CPD Regulations`},
  {q:/acca.*cpd|acca.*continuing/i,a:`ACCA CPD requirement (per yr):\n\n• 40 CPD units total (1 unit = 1 hour relevant learning)\n• At least 21 units must be VERIFIABLE\n• Up to 19 units may be non-verifiable (reading, reflection)\n• Annual declaration with subscription renewal\n• Practising cert holders: additional risk-based requirements\n\nSource: ACCA Continuing Professional Development guide`},
  {q:/aml.*super|supervis|supervisor.*opt/i,a:`AML supervisor options for UK accountancy practices (MLR 2017):\n\nA firm MUST be supervised by ONE of:\n• HMRC (default if no body supervises)\n• ICAEW · ACCA · CIMA · AAT · CIOT · ATT · IFA · IPA · ICAS · CAI\n\nProfessional body members typically supervised by the body. Bookkeepers without body membership default to HMRC.\n\nAnnual fee + risk-based supervision visits. Failure to register = criminal offence under MLR 2017 reg 56.`},
  {q:/64-8|agent auth|hmrc agent.*period/i,a:`64-8 HMRC agent authorisation:\n\n• Form 64-8 authorises an agent to deal with HMRC for SA / CT / VAT / PAYE / CIS\n• NOT strictly time-limited — remains until cancelled by client OR agent\n• Best practice: review every 3-5 years, re-confirm at engagement renewal\n• Cancelled by either party in writing to HMRC\n• Online Agent Services: separate digital handshake (MTD), refresh per service\n\nSource: HMRC form 64-8 notes`},
  {q:/retain.*client.*record|client record.*retain|record.*retention/i,a:`Client record retention:\n\n• HMRC: 6 years from end of accounting period (corporation tax / income tax records)\n• ICAEW practice records: 7 years minimum\n• AML/KYC documents: 5 years from end of business relationship (MLR 2017 reg 40)\n• Payroll records: 3 years from end of tax year (PAYE) + 6 years for HMRC review\n\nKeep in encrypted form. Soft-delete with archivedAt timestamp; do not hard-delete within retention window.`},
  {q:/verify.*identity|client.*identif|kyc.*step/i,a:`Reasonable steps to verify client identity (MLR 2017 reg 28):\n\n• Identity: name, DOB, address verified from independent source\n• Individuals: passport/driving licence + recent (3m) utility bill or bank statement\n• Companies: Companies House confirmation, PSC register check, directors ID'd\n• Beneficial owners (25%+ owner/controller): identified and verified\n• Sanctions screening: OFSI consolidated list at onboarding and ongoing\n• PEP check: enhanced due diligence if PEP/PEP family\n\nRecord retained 5y post-relationship end.`},
  {q:/engagement.*renew|engagement letter|letter.*engagement/i,a:`Engagement letter renewal cadence:\n\n• ICAEW: recommend annual review; reissue when scope/fee changes materially\n• ACCA: must be in writing before work commences; review at least annually\n• MUST be reissued when: service scope changes, fees change, AML risk grade changes, beneficial ownership changes\n• Both parties sign (electronic signature acceptable)\n• Retain signed copy in client file (7 years post-relationship)`},
  {q:/fee.*notif|notify.*fee|fee.*chang|fee.*increase/i,a:`Fee notification rules:\n\n• ICAEW Code §240: fees must be agreed in advance and notified in writing\n• Material changes require written notification BEFORE work commences\n• Disengagement letter required if fees disputed and unpaid\n• "Lowballing" prohibited (cannot set initial fee so low it impairs quality)\n• Contingent fees prohibited for assurance work; permitted for tax advisory with safeguards`},
  {q:/practice purchase|buy.*practice|fee block/i,a:`Practice (fee block) purchase considerations:\n\n• Typical valuation: 0.8-1.4 × recurring fees (varies by client mix, retention)\n• Earnouts standard (2-3 year retention claw-back)\n• Due diligence: AML files, engagement letters, PI claims history, client concentration\n• ICAEW notification required if transfer affects continuing professional duties\n• TUPE may apply if staff transfer\n• Client consent for record transfer (data protection)`},

const IDB_STORES=['firms','advisers','clients','deadlines','timeEntries','invoices','feeRecords','hmrcAgentAuths','piPolicies','professionalBodyFees','expenses','sars','cpdLog','audit','settings'];

let db=null;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(STORE,1);
    r.onupgradeneeded=()=>{
      const d=r.result;
      IDB_STORES.forEach(s=>{
        if(!d.objectStoreNames.contains(s)) d.createObjectStore(s,{keyPath:'id'});
      });
    };
    r.onsuccess=()=>{db=r.result;res(db)};
    r.onerror=()=>rej(r.error);
  });
}
function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store)}
function dbPut(store,rec){return new Promise((res,rej)=>{const r=tx(store,'readwrite').put(rec);r.onsuccess=()=>res(rec);r.onerror=()=>rej(r.error)})}
function dbGet(store,id){return new Promise((res,rej)=>{const r=tx(store).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function dbAll(store){return new Promise((res,rej)=>{const r=tx(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function dbDel(store,id){return new Promise((res,rej)=>{const r=tx(store,'readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}

// Audit chain
async function appendAudit(action,reasoning,payload={},adviserId='',clientId=''){
  const prev=(await dbAll('audit')).sort((a,b)=>b.i-a.i)[0];
  const prevHash=prev?prev.docHash:'GENESIS';
  const i=prev?prev.i+1:1;
  const body={i,ts:now(),tool:TOOLNAME,adviserId,clientId,action,reasoning,configVersion:`${TOOLNAME}@${VERSION}`,prevHash,payload};
  const json=JSON.stringify(body);
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(json));
  const docHash=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  body.docHash=docHash; body.id='aud_'+i;
  await dbPut('audit',body); return body;
}

// KONOMI shim · fall-signal + fall-books mesh
// ════════════════════════════════════════════════════════════════
let bcSignal=null, bcBooks=null;
function meshInit(){
  try{
    bcSignal=new BroadcastChannel('fall-signal');
    bcBooks=new BroadcastChannel('fall-books');
    bcBooks.onmessage=onBooksMessage;
    // boot sync request
    setTimeout(()=>{
      bcBooks.postMessage({v:1,type:'sync.request',ts:now(),source:TOOLNAME,payload:{}});
    },400);
  }catch(e){console.warn('mesh unavailable',e)}
}
function meshSend(type,payload){
  if(!bcBooks)return;
  try{bcBooks.postMessage({v:1,type,ts:now(),source:TOOLNAME,payload});}catch(e){}
}
async function onBooksMessage(ev){
  const m=ev.data; if(!m||m.source===TOOLNAME)return;
  try{
    if(m.type==='sync.request'){
      meshSend('sync.snapshot',{clients:state.clients,advisers:state.advisers,firm:state.firm});
    } else if(m.type==='sync.snapshot'){
      const p=m.payload||{};
      if(p.firm && (!state.firm||((p.firm.updatedAt||0)>(state.firm.updatedAt||0)))){state.firm=p.firm;await dbPut('firms',p.firm);}
      for(const c of (p.clients||[])){
        const local=state.clients.find(x=>x.id===c.id);
        if(!local || (c.updatedAt||0)>(local.updatedAt||0)){await dbPut('clients',c);}
      }
      for(const a of (p.advisers||[])){
        const local=state.advisers.find(x=>x.id===a.id);
        if(!local || (a.updatedAt||0)>(local.updatedAt||0)){await dbPut('advisers',a);}
      }
      await refreshState(); render();
    } else if(m.type==='client.created'||m.type==='client.updated'){
      const c=m.payload; if(!c||!c.id)return;
      const local=state.clients.find(x=>x.id===c.id);
      if(!local || (c.updatedAt||0)>(local.updatedAt||0)){
        await dbPut('clients',c); await refreshState(); render();
      }
    } else if(m.type==='adviser.created'||m.type==='adviser.updated'){
      const a=m.payload; if(!a||!a.id)return;
      await dbPut('advisers',a); await refreshState(); render();
    } else if(m.type==='firm.updated'){
      if(m.payload){state.firm=m.payload;await dbPut('firms',m.payload);render();}
    } else if(m.type==='submission.recorded'){
      // auto-mark deadlines done
      const sub=m.payload; if(!sub||!sub.clientId||!sub.kind)return;
      const open=state.deadlines.filter(d=>d.clientId===sub.clientId && d.kind===sub.kind && d.status==='pending');
      for(const d of open){
        d.status='submitted'; d.submittedAt=sub.submittedAt||now(); d.submissionRef=sub.ref||'';
        d.updatedAt=now(); await dbPut('deadlines',d);
        if(d.recurring){await rollDeadlineForward(d);}
      }
      if(open.length){toast(`Auto-marked ${open.length} deadline(s) done`);await refreshState();render();}
    }
  }catch(e){console.warn('mesh handler error',e)}
}

// ════════════════════════════════════════════════════════════════
// Deadline engine — auto-populate from servicesEngaged
// ════════════════════════════════════════════════════════════════
function deriveDeadlinesForClient(client){
  const out=[];
  const services=client.servicesEngaged||[];
  const yearEndMD=client.yearEnd||'03-31'; // MM-DD
  const today=new Date(); const Y=today.getUTCFullYear();
  function nextYearEnd(){
    const [mm,dd]=yearEndMD.split('-').map(Number);
    let d=new Date(Date.UTC(Y,(mm||3)-1,dd||31,12,0,0));
    if(d.getTime() < now()) d=new Date(Date.UTC(Y+1,(mm||3)-1,dd||31,12,0,0));
    return d.getTime();
  }
  const ye=nextYearEnd();
  // Accounts (Ltd: 9m after YE)
  if(services.includes('accounts') && client.entityType==='limited-company'){
    out.push({kind:'ACC',dueAt:ye+9*30.5*86400000,notes:`Companies House accounts (9m after period end ${tsToISO(ye)})`});
  }
  // CT600 (12m after PE)
  if(services.includes('ct') && client.entityType==='limited-company'){
    out.push({kind:'CT600',dueAt:ye+12*30.5*86400000,notes:`CT600 (12m after period end ${tsToISO(ye)})`});
    out.push({kind:'CT-PAY',dueAt:ye+(9*30.5+1)*86400000,notes:`CT payment (9m+1d after period end)`});
  }
  // SA100 (31 Jan following 5 April year)
  if(services.includes('sa')){
    const taxYE=new Date(Date.UTC(Y,3,5,12,0,0));
    if(taxYE.getTime()<now()) taxYE.setUTCFullYear(Y+1);
    const sa=new Date(Date.UTC(taxYE.getUTCFullYear()+1,0,31,12,0,0));
    out.push({kind:'SA100',dueAt:sa.getTime(),notes:`SA100 for ${taxYE.getUTCFullYear()-1}-${String(taxYE.getUTCFullYear()).slice(-2)} tax year`});
  }
  // VAT (quarterly: 1m+7d after quarter end). Find next quarter from today.
  if(services.includes('vat')){
    const m=today.getUTCMonth();
    const qEnds=[2,5,8,11]; // Mar, Jun, Sep, Dec
    let qe=qEnds.find(q=>q>=m); if(qe===undefined){qe=2;}
    const yq = qe>=m ? Y : Y+1;
    const qEnd=new Date(Date.UTC(yq,qe,28,12,0,0));
    out.push({kind:'VAT100',dueAt:qEnd.getTime()+(30+7)*86400000,notes:`VAT quarter ending ~${tsToISO(qEnd.getTime())}`});
  }
  // P11D (6 July following tax year end 5 April)
  if(services.includes('payroll')){
    const ty=new Date(Date.UTC(Y,3,5,12,0,0));
    if(ty.getTime()<now()) ty.setUTCFullYear(Y+1);
    out.push({kind:'P11D',dueAt:new Date(Date.UTC(ty.getUTCFullYear(),6,6,12,0,0)).getTime(),notes:`P11D for ${ty.getUTCFullYear()-1}-${String(ty.getUTCFullYear()).slice(-2)}`});
    out.push({kind:'P60',dueAt:new Date(Date.UTC(ty.getUTCFullYear(),4,31,12,0,0)).getTime(),notes:`P60 to employees by 31 May`});
    // next-month FPS
    const fps=new Date(today); fps.setUTCDate(fps.getUTCDate()+25);
    out.push({kind:'PAYE-FPS',dueAt:fps.getTime(),notes:`PAYE FPS (next payroll run)`});
  }
  // CS01 (annual confirmation statement)
  if(services.includes('companies-house-filings') && client.entityType==='limited-company'){
    const cs=new Date(today); cs.setUTCFullYear(cs.getUTCFullYear()+1);
    out.push({kind:'CS01',dueAt:cs.getTime(),notes:`CS01 confirmation statement`});
  }
  return out.map(d=>({
    id:id('dl'), clientId:client.id, firmId:state.firm?.id||'',
    kind:d.kind, dueAt:d.dueAt, status:'pending', submittedAt:null, submissionRef:'',
    notes:d.notes, recurring:DEADLINE_KINDS[d.kind]?.recurring||'',
    createdAt:now(), updatedAt:now()
  }));
}

async function rollDeadlineForward(d){
  const meta=DEADLINE_KINDS[d.kind]; if(!meta||!meta.recurring)return;
  let nextDue=d.dueAt;
  if(meta.recurring==='monthly')nextDue+=30*86400000;
  else if(meta.recurring==='quarterly')nextDue+=91*86400000;
  else if(meta.recurring==='yearly')nextDue+=365*86400000;
  const nd={id:id('dl'),clientId:d.clientId,firmId:d.firmId,kind:d.kind,dueAt:nextDue,status:'pending',submittedAt:null,submissionRef:'',notes:d.notes+' (rolled)',recurring:meta.recurring,createdAt:now(),updatedAt:now()};
  await dbPut('deadlines',nd);
  meshSend('deadline.created',nd);
}

function deadlineColour(d){
  if(d.status==='submitted')return 'muted';
  const days=daysFromNow(d.dueAt);
  if(days<0)return 'black';
  if(days<=RULES.deadlineRedDays)return 'red';
  if(days<=RULES.deadlineAmberDays)return 'amber';
  return 'green';
}

// ════════════════════════════════════════════════════════════════
// PII calc
// ════════════════════════════════════════════════════════════════
function calcIcaewPiMin(){
  // 25 × highest annual fee from a single client, OR £1.5M (whichever LOWER), floor £100k
  const byClient={};
  state.feeRecords.forEach(f=>{
    if(!f.clientId)return;
    const ts=f.recordedAt||f.createdAt||now();
    const ageDays=(now()-ts)/86400000;
    if(ageDays>365)return;
    byClient[f.clientId]=(byClient[f.clientId]||0)+(Number(f.amount)||0);
  });
  const highest=Math.max(0,...Object.values(byClient));
  const calc=Math.min(highest*RULES.icaewPiMultiplier, RULES.icaewPiCap);
  return Math.max(calc, RULES.icaewPiMinFloor);
}
function calcAccaPiMin(){
  const total=state.feeRecords.filter(f=>(now()-(f.recordedAt||f.createdAt||now()))/86400000<=365).reduce((s,f)=>s+(Number(f.amount)||0),0);
  return Math.max(total*RULES.accaPiMultiplier, RULES.accaPiMinFloor);
}
function requiredPiCover(){
  const body=state.firm?.professionalBody||'ICAEW';
  if(body==='ACCA') return calcAccaPiMin();
  return calcIcaewPiMin();
}

async function markDeadlineDone(did){
  const d=state.deadlines.find(x=>x.id===did); if(!d)return;
  const ref=prompt('Submission reference (HMRC receipt / Companies House barcode):','')||'';
  d.status='submitted'; d.submittedAt=now(); d.submissionRef=ref; d.updatedAt=now();
  await dbPut('deadlines',d);
  meshSend('deadline.marked-done',d);
  meshSend('submission.recorded',{clientId:d.clientId,kind:d.kind,ref,submittedAt:d.submittedAt});
  if(d.recurring) await rollDeadlineForward(d);
  await appendAudit('deadline.submitted',`Marked ${d.kind} done`,{ref,due:d.dueAt},'',d.clientId);
  await refreshState(); render(); toast('Deadline marked done');
}
async function reopenDeadline(did){
  const d=state.deadlines.find(x=>x.id===did); if(!d)return;
  d.status='pending'; d.submittedAt=null; d.submissionRef=''; d.updatedAt=now();
  await dbPut('deadlines',d); await refreshState(); render();
}
async function deleteDeadline(did){
  if(!confirm('Delete deadline?'))return;
  await dbDel('deadlines',did); await refreshState(); render();
}
async function rebuildAllDeadlines(){
  if(!confirm('Rebuild deadlines from clients? Pending deadlines will be replaced with newly-derived set; submitted entries preserved.'))return;
  const subs=state.deadlines.filter(d=>d.status==='submitted');
  for(const d of state.deadlines.filter(d=>d.status==='pending'))await dbDel('deadlines',d.id);
  for(const c of state.clients){
    const dls=deriveDeadlinesForClient(c);
    for(const d of dls)await dbPut('deadlines',d);
  }
  await appendAudit('deadlines.rebuilt','Bulk rebuild from clients',{count:state.clients.length});
  await refreshState(); render(); toast('Deadlines rebuilt');
}

async function runRecurringFees(){
  // For each fixed-monthly client, post a fee if no fee recorded in the current month
  const Y=new Date().getUTCFullYear(); const M=new Date().getUTCMonth();
  let n=0;
  for(const c of state.clients){
    if(c.engagement?.feeBasis!=='fixed-monthly')continue;
    const has=state.feeRecords.some(f=>f.clientId===c.id && new Date(f.recordedAt).getUTCFullYear()===Y && new Date(f.recordedAt).getUTCMonth()===M && f.type==='fixed-monthly');
    if(has)continue;
    const fr={id:id('fr'),clientId:c.id,firmId:state.firm?.id||'',adviserId:c.adviserId||'',
      type:'fixed-monthly',amount:Number(c.engagement.feeAmount)||0,recordedAt:now(),
      narrative:`Auto-recurring ${new Date().toLocaleString('en-GB',{month:'long'})} retainer`,invoiceId:'',ts:now()};
    await dbPut('feeRecords',fr); meshSend('fee.recorded',fr); n++;
  }
  await appendAudit('recurring.fees.run',`Auto-posted ${n} monthly fees`,{count:n});
  await refreshState(); render(); toast(`Posted ${n} recurring fees`);
}

async function askQA(){
  const inp=document.getElementById('qInput'); const q=inp.value.trim(); if(!q)return;
  chatHist.push({role:'user',text:q}); inp.value='';
  const hit=T0.find(r=>r.q.test(q));
  if(hit){
    chatHist.push({role:'bot',text:hit.a,src:'T0 canned rule'});
  } else if(state.settings.tier==='T3' && state.settings.apiKey){
    chatHist.push({role:'bot',text:'(T3 BYOK · would dispatch to Claude API here)',src:'T3'});
  } else {
    chatHist.push({role:'bot',text:`No canned rule matched. Try keywords: ICAEW, ACCA, PII, CPD, AML, 64-8, retention, engagement, SAR, risk.\n\nUpgrade to T3 (settings · paste Anthropic API key) for arbitrary research.`,src:'T0 fallback'});
  }
  render();
  setTimeout(()=>{const c=document.getElementById('chat');if(c)c.scrollTop=c.scrollHeight},50);
}

// GENERATE INVOICE
function modalGenerateInvoice(){
  return {title:'Generate invoice',body:`
  <div class="field"><label>client</label><select id="i_cli">${state.clients.map(c=>`<option value="${c.id}">${esc(c.entityName||c.lastName||'?')}</option>`).join('')}</select></div>
  <div class="field"><label>unbilled period from</label><input id="i_from" type="date"></div>
  <div class="field"><label>also include WIP time?</label><select id="i_wip"><option value="yes">yes</option><option value="no">no</option></select></div>
  <div class="actions"><button class="btn" onclick="closeModal()">cancel</button><button class="btn primary" onclick="generateInvoice()">generate</button></div>`};
}
async function generateInvoice(){
  const clientId=document.getElementById('i_cli').value;
  const from=isoToTs(document.getElementById('i_from').value)||(now()-90*86400000);
  const includeWip=document.getElementById('i_wip').value==='yes';
  const c=state.clients.find(x=>x.id===clientId);
  const fees=state.feeRecords.filter(f=>f.clientId===clientId && !f.invoiceId && f.recordedAt>=from);
  let wipLines=[];
  if(includeWip){
    const time=state.timeEntries.filter(t=>t.clientId===clientId && t.billable && !t.billedRef);
    const grouped={};
    time.forEach(t=>{const a=state.advisers.find(x=>x.id===t.adviserId);const rate=a?.hourlyRate||120;
      grouped[t.activity]=grouped[t.activity]||{min:0,value:0,rate};
      grouped[t.activity].min+=t.minutes; grouped[t.activity].value+=t.minutes/60*rate;});
    wipLines=Object.entries(grouped).map(([act,d])=>({desc:`${act} · ${(d.min/60).toFixed(2)}h @ £${d.rate}/h`,amount:d.value}));
  }
  const lines=[...fees.map(f=>({desc:f.narrative||f.type,amount:f.amount})),...wipLines];
  const subtotal=lines.reduce((s,l)=>s+l.amount,0);
  const vat=state.firm?.vatNumber?subtotal*RULES.vatStandard:0;
  const total=subtotal+vat;
  const num='INV-'+new Date().getUTCFullYear()+'-'+String(state.invoices.length+1).padStart(4,'0');
  const inv={id:id('inv'),number:num,clientId,firmId:state.firm?.id||'',
    issuedAt:now(),dueAt:now()+RULES.invoiceTermsDays*86400000,
    lines,subtotal,vat,total,status:'issued'};
  await dbPut('invoices',inv);
  // mark linked
  for(const f of fees){f.invoiceId=inv.id;await dbPut('feeRecords',f);}
  if(includeWip){
    for(const t of state.timeEntries.filter(t=>t.clientId===clientId && t.billable && !t.billedRef)){
      t.billedRef=inv.id;await dbPut('timeEntries',t);
    }
  }

  // Markdown
  const md=`# Invoice ${num}

**From:** ${state.firm?.name||''}\n**To:** ${c?.entityName||c?.lastName||''}
**Issued:** ${fmtDate(inv.issuedAt)} · **Due:** ${fmtDate(inv.dueAt)}

| Description | Amount |
|---|---:|
${lines.map(l=>`| ${l.desc} | ${fmtGBP(l.amount)} |`).join('\n')}
| **Subtotal** | **${fmtGBP(subtotal)}** |
| VAT @ 20% | ${fmtGBP(vat)} |
| **Total** | **${fmtGBP(total)}** |

Payment terms: ${RULES.invoiceTermsDays} days.
${state.firm?.vatNumber?'VAT Reg: '+state.firm.vatNumber:''}
`;
  // Handoff to FallBooksPaper via postMessage
  try{
    if(bcBooks)bcBooks.postMessage({v:1,type:'invoice.draft',ts:now(),source:TOOLNAME,payload:{invoice:inv,markdown:md,client:c}});
  }catch(e){}

  await appendAudit('invoice.generated',num,{total,lines:lines.length},'',clientId);
  closeModal(); await refreshState();
  // Show markdown for download
  const m=document.getElementById('modal');
  const t=document.getElementById('modalTitle');
  const b=document.getElementById('modalBody');
  m.classList.add('open');
  t.textContent=num;
  b.innerHTML=`<pre style="background:var(--ink);padding:12px;border-radius:3px;font-family:var(--mono);font-size:11px;white-space:pre-wrap;max-height:50vh;overflow:auto">${esc(md)}</pre>
  <div class="actions">
    <button class="btn" onclick="navigator.clipboard.writeText(\`${md.replace(/`/g,'\\`').replace(/\$/g,'\\$')}\`).then(()=>toast('Copied'))">copy MD</button>
    <button class="btn primary" onclick="downloadInvoice('${inv.id}')">↓ download .md</button>
    <button class="btn" onclick="closeModal()">close</button>
  </div>`;
  toast('Invoice '+num+' generated');
}
async function downloadInvoice(invId){
  const inv=state.invoices.find(x=>x.id===invId); const c=state.clients.find(x=>x.id===inv.clientId);
  const md=`# Invoice ${inv.number}\n\nFrom: ${state.firm?.name||''}\nTo: ${c?.entityName||''}\nTotal: ${fmtGBP(inv.total)}\n\n${inv.lines.map(l=>`- ${l.desc}: ${fmtGBP(l.amount)}`).join('\n')}`;
  const blob=new Blob([md],{type:'text/markdown'}); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=`${inv.number}.md`; a.click();
}

  await appendAudit('cpd.logged',l.activity,{hrs},aid);
  closeModal(); await refreshState(); render(); toast('CPD logged');
}

function modalEditAdviser(aid){

  return {title:'Edit · '+a.name,body:`
  <div class="row">
    <div class="field"><label>name</label><input id="ea_n" value="${esc(a.name)}"></div>
    <div class="field"><label>email</label><input id="ea_e" value="${esc(a.email)}"></div>

  </div>
  <div class="actions"><button class="btn" onclick="closeModal()">cancel</button><button class="btn primary" onclick="saveEditAdviser('${aid}')">save</button></div>`};
}
async function saveEditAdviser(aid){
  const a=state.advisers.find(x=>x.id===aid);
  a.name=document.getElementById('ea_n').value; a.email=document.getElementById('ea_e').value;
  a.hourlyRate=Number(document.getElementById('ea_hr').value)||0;
  a.cpdHoursThisYear=Number(document.getElementById('ea_cpd').value)||0;
  a.updatedAt=now();
  await dbPut('advisers',a); meshSend('adviser.updated',a);
  closeModal(); await refreshState(); render(); toast('Saved');
}
